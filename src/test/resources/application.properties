# Configuracao usada apenas quando os testes rodam (mvn test).
# Usa banco H2 em memoria, para os testes nao dependerem de um
# MySQL rodando na maquina/servidor de CI.
spring.datasource.url=jdbc:h2:mem:crm_simples_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mesma política de produção: o Flyway cria o schema (V1__init.sql,
# compatível com H2) e o Hibernate só valida — assim os testes rodam
# contra o schema versionado real, não contra um schema inferido pelas
# entidades, e pegam qualquer divergência entre migration e entidade.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=test-secret-key-usada-somente-nos-testes-automatizados-1234
app.cors.allowed-origins=http://localhost:5173
