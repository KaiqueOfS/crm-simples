# Configuracao usada apenas quando os testes rodam (mvn test).
# Usa banco H2 em memoria, para os testes nao dependerem de um
# MySQL rodando na maquina/servidor de CI.
spring.datasource.url=jdbc:h2:mem:crm_simples_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-key-usada-somente-nos-testes-automatizados-1234
app.cors.allowed-origins=http://localhost:5173
