spring.application.name=orbis-crm

# Perfil ativo por padrao: "dev" (comportamento local de sempre — nada muda
# se voce nao definir nada). Em producao, defina a variavel de ambiente
# SPRING_PROFILES_ACTIVE=prod. Configuracoes especificas de cada ambiente
# ficam em application-dev.properties / application-prod.properties; aqui
# so fica o que e igual nos dois.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ---------------------------------------------------------------------------
# Banco de dados (MySQL)
# ---------------------------------------------------------------------------
# Host/porta/nome parametrizados (Sprint 16.2.1) para apontar a um banco
# gerenciado externo em deploy, sem tocar em código — os defaults abaixo
# mantêm o comportamento local de sempre (mesmo MySQL na sua máquina).
#
# Suporte a PostgreSQL: o driver ja esta no classpath (ver pom.xml). Para
# rodar sobre Postgres em vez de MySQL, sobrescreva as tres propriedades
# abaixo (via variavel de ambiente ou um profile proprio), por exemplo:
#   spring.datasource.url=jdbc:postgresql://HOST:5432/DB_NAME
#   spring.datasource.driver-class-name=org.postgresql.Driver
#   spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Nada disso muda o comportamento atual: o padrao continua MySQL.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_simples}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo&sslMode=REQUIRED
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# O schema é versionado pelo Flyway (src/main/resources/db/migration).
# validate só CONFERE se as entidades batem com o schema já migrado —
# nunca cria, altera ou apaga nada. Nunca troque para "update" ou
# "create"/"create-drop" em produção: veja docs/FLYWAY.md.
spring.jpa.hibernate.ddl-auto=validate

# Flyway aplica as migrations de src/main/resources/db/migration
# automaticamente na inicialização, antes do Hibernate validar o schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
# Garante que requests e responses HTTP usem UTF-8 (acentos corretos no JSON)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Compressão gzip das respostas — reduz o tamanho do JSON da API e do
# build do frontend (JS/CSS) servido por este mesmo backend.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript,text/plain
server.compression.min-response-size=1024

# ---------------------------------------------------------------------------
# Segurança e autenticação
# ---------------------------------------------------------------------------
# Segredo usado para assinar os tokens JWT (carregado do .env)
jwt.secret=${JWT_SECRET}

# Origens permitidas para CORS, separadas por virgula.
# Em producao, defina a variavel de ambiente ALLOWED_ORIGINS com o dominio real do frontend.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Rate limiting de POST /api/auth/login (força bruta/credential stuffing).
# Ver docs/RATE-LIMITING.md para o motivo dos números e como ajustá-los.
app.rate-limit.login.max-tentativas-email=5
app.rate-limit.login.max-tentativas-ip=10
app.rate-limit.login.janela-segundos=60

# ---------------------------------------------------------------------------
# Actuator (health check de produção)
# ---------------------------------------------------------------------------
# Expõe só /actuator/health — nunca "*". env/beans/configprops/etc vazariam
# detalhe interno (variáveis de ambiente, grafo de beans) se expostos aqui.
management.endpoints.web.exposure.include=health
# Detalhe do status (ex.: conectividade do banco) só para quem tem permissão;
# aberto em dev (application-dev.properties) para facilitar debug local.
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Demo
# ---------------------------------------------------------------------------
# Popula a conta demo (demo@orbiscrm.com) na inicialização — ver DemoSeeder.
# Desligado por padrão; ligar só em ambiente de apresentação/demo.
app.demo.seed.enabled=${DEMO_SEED_ENABLED:false}
