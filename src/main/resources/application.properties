spring.application.name=crm-simples

# Configuracoes do banco MySQL
# Host/porta/nome parametrizados (Sprint 16.2.1) para apontar a um banco
# gerenciado externo em deploy, sem tocar em código — os defaults abaixo
# mantêm o comportamento local de sempre (mesmo MySQL na sua máquina).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_simples}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema é versionado pelo Flyway (src/main/resources/db/migration).
# validate só CONFERE se as entidades batem com o schema já migrado —
# nunca cria, altera ou apaga nada. Nunca troque para "update" ou
# "create"/"create-drop" em produção: veja docs/FLYWAY.md.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway aplica as migrations de src/main/resources/db/migration
# automaticamente na inicialização, antes do Hibernate validar o schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Garante que requests e responses HTTP usem UTF-8 (acentos corretos no JSON)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Segredo usado para assinar os tokens JWT (carregado do .env)
jwt.secret=${JWT_SECRET}

# Origens permitidas para CORS, separadas por virgula.
# Em producao, defina a variavel de ambiente ALLOWED_ORIGINS com o dominio real do frontend.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Rate limiting de POST /api/auth/login (força bruta/credential stuffing).
# Ver docs/RATE-LIMITING.md para o motivo dos números e como ajustá-los.
app.rate-limit.login.max-tentativas-email=5
app.rate-limit.login.max-tentativas-ip=10
app.rate-limit.login.janela-segundos=60

# Popula a conta demo (demo@orbiscrm.com) na inicialização — ver DemoSeeder.
# Desligado por padrão; ligar só em ambiente de apresentação/demo.
app.demo.seed.enabled=${DEMO_SEED_ENABLED:false}