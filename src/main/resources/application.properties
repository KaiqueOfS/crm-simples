spring.application.name=crm-simples

# Configuracoes do banco MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/crm_simples?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Faz o Spring criar/atualizar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Garante que requests e responses HTTP usem UTF-8 (acentos corretos no JSON)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Segredo usado para assinar os tokens JWT (carregado do .env)
jwt.secret=${JWT_SECRET}

# Origens permitidas para CORS, separadas por virgula.
# Em producao, defina a variavel de ambiente ALLOWED_ORIGINS com o dominio real do frontend.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}