# Perfil "prod" — ativar definindo a variável de ambiente
# SPRING_PROFILES_ACTIVE=prod no ambiente de deploy.

# Logs de produção: reduz ruído (root em WARN) e mantém só o necessário do
# próprio código da aplicação em INFO — evita poluir os logs reais com
# debug de frameworks de terceiros.
logging.level.root=WARN
logging.level.com.kaique.crm_simples=INFO
logging.level.org.hibernate.SQL=WARN

# Nunca vazar detalhe do health check (ex.: motivo de falha de conexão com
# o banco) para quem não está autenticado — reforça explicitamente o
# default seguro já definido em application.properties.
management.endpoint.health.show-details=never
