# Perfil "dev" — ambiente local. Ativo por padrão (ver application.properties);
# só existe para deixar explícito o que é diferente do padrão de produção.

# Logs mais verbosos, úteis para depurar localmente.
logging.level.root=INFO
logging.level.com.kaique.crm_simples=DEBUG

# Detalhe completo do health check (ex.: motivo de uma falha de conexão com
# o banco) liberado em dev — não faz sentido esconder isso de quem está
# rodando a aplicação na própria máquina.
management.endpoint.health.show-details=always
