name: Testes Backend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  testes:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rodar testes Maven
        run: mvn clean test